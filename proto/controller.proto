// Robot Controller & Teach Pendant Validation Platform
// P0: 控制器指令层协议（PLCopen 语义 + 轨迹批量回传）
// 设计原则：Python 只下发一次命令；C++ Agent 在内部控制环执行并采样，
// 完成后将 timestamp[]/joint[]/trajectory 批量返回，避免解释器/RPC 影响实时执行。
syntax = "proto3";

package robottest;

// ---------------------------------------------------------------------------
// 服务：控制器指令接口
// ---------------------------------------------------------------------------
service ControllerService {
  // 伺服使能 / 去使能
  rpc Enable(EnableRequest) returns (CommandResult);
  rpc Disable(DisableRequest) returns (CommandResult);
  // PLCopen MC_Home（P0：回零运动）
  rpc Home(HomeRequest) returns (CommandResult);
  // PLCopen MC_MoveAbsolute / MC_MoveRelative
  rpc MoveAbsolute(MoveAbsoluteRequest) returns (CommandResult);
  rpc MoveRelative(MoveRelativeRequest) returns (CommandResult);
  // 停止（normal=CommandAborted；emergency=Fault，需 Reset 恢复）
  rpc Stop(StopRequest) returns (CommandResult);
  rpc Reset(ResetRequest) returns (CommandResult);
  // 读取当前状态（轮询 / 连接就绪探测）
  rpc GetState(GetStateRequest) returns (RobotState);
}

// ---------------------------------------------------------------------------
// 消息定义
// ---------------------------------------------------------------------------
message EnableRequest {}
message DisableRequest {}

message HomeRequest {
  double velocity = 1;     // deg/s，各轴按 Profile 限速钳制
  double acceleration = 2; // deg/s^2
  double deceleration = 3; // deg/s^2
}

message MoveAbsoluteRequest {
  repeated double target_position = 1; // deg，每轴一个
  double velocity = 2;     // deg/s
  double acceleration = 3; // deg/s^2
  double deceleration = 4; // deg/s^2
  double jerk = 5;         // deg/s^3（P0 暂不参与剖面，保留字段）
  bool abort_current = 6;  // true: 中止当前运动并下发新命令；false: 忙则报 BUSY
}

message MoveRelativeRequest {
  repeated double delta = 1; // deg 增量
  double velocity = 2;
  double acceleration = 3;
  double deceleration = 4;
  double jerk = 5;
}

message StopRequest {
  bool emergency = 1; // true=急停(FAULT) false=普通停止(CommandAborted)
}

message ResetRequest {}

message GetStateRequest {}

message JointState {
  double position = 1;     // deg
  double velocity = 2;     // deg/s
  double acceleration = 3; // deg/s^2
}

message RobotState {
  uint64 timestamp_ns = 1;
  repeated JointState joints = 2;
  bool enabled = 3;
  bool moving = 4;
  bool error = 5;
  int32 error_code = 6;
  string error_message = 7;
  string motion_state = 8; // IDLE / BUSY / ACTIVE / DONE / ABORTED / ERROR
}

message TrajectorySample {
  uint64 timestamp_ns = 1;
  repeated JointState joints = 2;
  string motion_state = 3;
}

// ---------------------------------------------------------------------------
// 服务：CiA402 驱动器状态机（P1：虚拟从站，纯软件层，软硬件解耦）
// 每个 slave_id 对应一个驱动器从站（MAiRA 7 轴 = 7 个独立状态机）。
// 状态机/对象字典按 CiA 402 / IEC 61800-7 语义实现，不依赖真实硬件。
// ---------------------------------------------------------------------------
service Cia402Service {
  // 写 Controlword (0x6040)：驱动状态机迁移（含 Fault Reset 上升沿）
  rpc SetControlword(SetControlwordRequest) returns (Cia402Result);
  // 读 Statusword (0x6041) + 状态机状态名
  rpc GetStatusword(GetStatuswordRequest) returns (GetStatuswordResponse);
  // 通用 CoE 对象字典读写（0x6040 写走状态机；只读对象拒绝写）
  rpc ReadObject(ReadObjectRequest) returns (ReadObjectResponse);
  rpc WriteObject(WriteObjectRequest) returns (WriteObjectResponse);
  // 设置 Modes of Operation (0x6060)
  rpc SetMode(SetModeRequest) returns (Cia402Result);
  // 注入故障（测试辅助：任意状态 -> FaultReactionActive -> Fault）
  rpc InjectFault(InjectFaultRequest) returns (Cia402Result);
}

message SetControlwordRequest {
  int32 slave_id = 1;
  uint32 controlword = 2; // 0x6040（bit0-3 命令 + bit7 Fault Reset）
}

message GetStatuswordRequest {
  int32 slave_id = 1;
}

message GetStatuswordResponse {
  bool ok = 1;
  uint32 statusword = 2; // 0x6041
  string state = 3;      // 状态机状态名（如 SwitchOnDisabled）
  string error = 4;
}

message ReadObjectRequest {
  int32 slave_id = 1;
  uint32 index = 2;
  uint32 subindex = 3;
}

message ReadObjectResponse {
  bool ok = 1;
  uint32 value = 2;
  string error = 3;
}

message WriteObjectRequest {
  int32 slave_id = 1;
  uint32 index = 2;
  uint32 subindex = 3;
  uint32 value = 4;
}

message WriteObjectResponse {
  bool ok = 1;
  string error = 2;
}

message SetModeRequest {
  int32 slave_id = 1;
  uint32 mode = 2; // 0x6060: 1=ProfilePosition 3=ProfileVelocity 6=Homing 8=CSP
}

message InjectFaultRequest {
  int32 slave_id = 1;
}

message Cia402Result {
  bool ok = 1;
  string error = 2;
  uint32 statusword = 3; // 操作后的 0x6041
  string state = 4;      // 操作后的状态机状态名
}

message CommandResult {
  bool ok = 1;
  int32 error_code = 2;    // 0=OK 1=NOT_ENABLED 2=JOINT_LIMIT 3=BUSY
                           // 4=ABORTED 5=EMERGENCY_STOP 6=FAULT 7=UNKNOWN
  string error_message = 3;
  string command = 4;
  string motion_state = 5; // 最终状态：DONE / ABORTED / ERROR / IDLE
  uint64 duration_ms = 6;  // 命令执行墙钟时长
  int32 sample_count = 7;
  repeated TrajectorySample samples = 8; // C++ 控制环批量采样的轨迹
}

// ---------------------------------------------------------------------------
// 服务：EtherCAT 虚拟总线（P1-2：周期过程数据交换 PDO，纯软件层）
// 主站经总线每周期写 Output PDO（0x6040 Controlword / 0x607A TargetPos），
// 从站返回 Input PDO（0x6041 Statusword / 0x6064 ActualPos + 状态机名）。
// 真实硬件替换点：P2 将 VirtualEthercatBus 后端换成 SOEM/IgH 真实主站，
// 对外 gRPC 接口不变 —— 软硬件解耦。
// ---------------------------------------------------------------------------
service EthercatService {
  // 总线信息（从站数 / 名义控制周期）
  rpc BusInfo(BusInfoRequest) returns (BusInfoResponse);
  // 单周期过程数据交换
  rpc CycleExchange(CycleExchangeRequest) returns (CycleExchangeResponse);
  // 连续 N 周期（真实计时 + 自旋等待），统计实际频率与周期抖动 jitter
  rpc RunCycles(RunCyclesRequest) returns (RunCyclesResponse);
  // 异常注入（P1-5）：总线错误 / 从站丢失 / 通信断开
  rpc InjectBusFault(InjectBusFaultRequest) returns (InjectBusFaultResponse);
  rpc ClearBusFault(ClearBusFaultRequest) returns (ClearBusFaultResponse);
}

message BusInfoRequest {}

message BusInfoResponse {
  bool ok = 1;
  int32 slave_count = 2;
  int32 cycle_hz = 3;
  string error = 4;
}

message SlaveOutput {
  int32 slave_id = 1;
  uint32 controlword = 2;    // 0x6040 映射（Output PDO）
  int32 target_position = 3; // 0x607A 映射；=0 表示不写入
}

message SlaveInput {
  int32 slave_id = 1;
  uint32 statusword = 2;     // 0x6041 映射（Input PDO）
  int32 actual_position = 3; // 0x6064 映射
  string state = 4;          // 状态机状态名；从站丢失时为 "LOST"
  bool lost = 5;             // true: 从站已从总线丢失（无响应）
}

message CycleExchangeRequest {
  repeated SlaveOutput outputs = 1;
}

message CycleExchangeResponse {
  bool ok = 1;
  repeated SlaveInput inputs = 2;
  int64 timestamp_ns = 3;
  string error = 4;
}

message RunCyclesRequest {
  repeated SlaveOutput outputs = 1;
  int32 cycles = 2;
  int32 cycle_hz = 3;
}

message RunCyclesResponse {
  bool ok = 1;
  int32 cycles = 2;
  double actual_hz = 3;        // 实测平均频率
  double jitter_min_us = 4;    // 周期抖动 min（us）
  double jitter_max_us = 5;    // 周期抖动 max（us）
  double jitter_mean_us = 6;
  double jitter_std_us = 7;
  repeated SlaveInput first_inputs = 8;
  repeated SlaveInput last_inputs = 9;
  string error = 10;
  // 实时性量化（P1-3）：单周期交换处理耗时 = 命令发起到输入 PDO 就绪。
  // 真实系统对应"控制周期内计算/通信延迟"，若超过周期即为 overrun。
  double latency_min_us = 11;
  double latency_max_us = 12;
  double latency_mean_us = 13;
  double latency_std_us = 14;
  int32 overrun_cycles = 15;   // 处理耗时 > 周期间隔的周期数（硬实时违规）
  // 逐周期明细（P1-6 波形可视化）：长度 = cycles - 1（interval）/ cycles（processing）
  repeated double interval_us = 16;     // 每个实际周期间隔（us），jitter 波形数据
  repeated double processing_us = 17;   // 每周期单周期处理耗时（us），latency 波形数据
}

// 异常注入类型（P1-5）
enum BusFaultType {
  BUS_FAULT_NONE = 0;        // 无故障
  BUS_FAULT_LINK_LOSS = 1;   // 通信断开：整条总线不可用（所有交换失败）
  BUS_FAULT_SLAVE_LOSS = 2;  // 从站丢失：指定从站无响应（其余正常）
  BUS_FAULT_BUS_ERROR = 3;   // 总线错误：帧级错误（CRC/看门狗），交换失败
}

message InjectBusFaultRequest {
  BusFaultType fault_type = 1;
  int32 slave_id = 2;        // SLAVE_LOSS 时指定；其余类型忽略
}

message InjectBusFaultResponse {
  bool ok = 1;
  string error = 2;
}

message ClearBusFaultRequest {}

message ClearBusFaultResponse {
  bool ok = 1;
  string error = 2;
}

// ---------------------------------------------------------------------------
// P2.2a：安全联锁仿真（SafetyStateMachine + 联锁矩阵）
// 语义：仿真层验证安全逻辑与状态联锁（ESTOP > 门 > 驱动器故障）；
//       真实安全 I/O（FSoE/硬接线）在 P2.2b HIL 阶段验证，不越界声称。
// ---------------------------------------------------------------------------
message SafetyInputsMsg {
  bool estop = 1;          // 急停按下（true=触发）
  bool door_open = 2;      // 安全门打开
  bool brake_released = 3; // 抱闸释放到位（false=未释放）
  bool drive_fault = 4;    // 任一驱动器故障
}

message SafetyOutputsMsg {
  bool allow_enable = 1;   // 允许使能
  bool stop_required = 2;  // 需要停机（联动 controller 停止）
  bool brake_request = 3;  // 请求抱闸
  string state = 4;        // SAFE / ESTOP / GUARDED / FAULT
  int32 error_code = 5;    // 0=OK 1=ESTOP 2=GUARD 3=DRIVE_FAULT
}

message SetSafetyInputRequest {
  SafetyInputsMsg inputs = 1;
}

message SetSafetyInputResponse {
  bool ok = 1;
  SafetyOutputsMsg outputs = 2;
}

message GetSafetyStateRequest {}

message GetSafetyStateResponse {
  SafetyInputsMsg inputs = 1;
  SafetyOutputsMsg outputs = 2;
}

service SafetyService {
  // 注入安全输入（仿真），返回联锁输出；stop_required 上升沿联动控制器停止
  rpc SetSafetyInput(SetSafetyInputRequest) returns (SetSafetyInputResponse);
  rpc GetSafetyState(GetSafetyStateRequest) returns (GetSafetyStateResponse);
}
