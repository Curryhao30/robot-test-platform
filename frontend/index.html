<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Test Platform · 测试管理控制台（可操作）</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --panel2: #273449;
    --line: #334155; --txt: #e2e8f0; --mut: #94a3b8;
    --ok: #22c55e; --bad: #ef4444; --acc: #38bdf8; --warn: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font: 14px/1.6 "Microsoft YaHei", system-ui, sans-serif; background: var(--bg); color: var(--txt); padding: 24px; }
  .wrap { max-width: 1180px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 20px; letter-spacing: .5px; }
  .badge { font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--mut); }
  .badge.ok { color: var(--ok); border-color: var(--ok); }
  .badge.bad { color: var(--bad); border-color: var(--bad); }
  .badge.run { color: var(--warn); border-color: var(--warn); }
  .ops { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  select, button { font: inherit; font-size: 13px; border-radius: 6px; padding: 7px 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--txt); cursor: pointer; }
  button.primary { background: var(--acc); color: #062033; border-color: var(--acc); font-weight: 600; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.mini { padding: 2px 8px; font-size: 11px; }
  button.mini.close { color: var(--ok); border-color: var(--ok); }
  button.mini.reopen { color: var(--warn); border-color: var(--warn); }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card .k { font-size: 12px; color: var(--mut); }
  .card .v { font-size: 26px; font-weight: 700; margin-top: 2px; }
  .grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px; margin-bottom: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .panel h2 { font-size: 14px; margin-bottom: 10px; color: var(--txt); display: flex; align-items: center; gap: 8px; }
  input[type=search] { width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--txt); border-radius: 6px; padding: 7px 10px; font-size: 13px; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--mut); font-weight: 600; border-bottom: 1px solid var(--line); padding: 6px 8px; }
  td { border-bottom: 1px solid #26334d; padding: 5px 8px; }
  tr:last-child td { border-bottom: none; }
  .g { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: #24344d; color: #7dd3fc; white-space: nowrap; }
  .st { font-size: 11px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  .st.pass { background: #123f2a; color: var(--ok); }
  .st.fail { background: #4a1520; color: var(--bad); }
  .run { border-bottom: 1px solid #26334d; padding: 8px 0; cursor: pointer; }
  .run:last-child { border-bottom: none; }
  .run .top { display: flex; justify-content: space-between; font-size: 12px; color: var(--mut); }
  .bar { height: 6px; border-radius: 3px; background: #334155; margin-top: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ok); }
  .detail { display: none; margin-top: 8px; max-height: 260px; overflow: auto; }
  .detail.open { display: block; }
  .def { display: flex; gap: 8px; font-size: 12px; padding: 6px 0; border-bottom: 1px solid #26334d; align-items: flex-start; }
  .def:last-child { border-bottom: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-top: 5px; flex: none; }
  .dot.c { background: var(--ok); }
  .dot.m { background: var(--warn); }
  .manual { color: var(--warn); font-size: 11px; }
  .empty { color: var(--mut); font-size: 13px; padding: 8px 0; }
  .note { color: var(--mut); font-size: 12px; margin-top: 8px; }
  .toast { position: fixed; right: 24px; bottom: 24px; background: var(--panel2); border: 1px solid var(--line); color: var(--txt); padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (max-width: 860px) { .cards { grid-template-columns: repeat(2, 1fr); } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Robot Test Platform</h1>
    <span class="badge" id="bProfile">—</span>
    <span class="badge" id="bCycle">—</span>
    <span class="badge" id="bRun">—</span>
    <span class="badge" id="bStatus">—</span>
    <div class="ops">
      <select id="grp"><option value="">全量运行</option></select>
      <button class="primary" id="runBtn" disabled>运行测试</button>
    </div>
  </header>

  <div class="cards">
    <div class="card"><div class="k">用例总数</div><div class="v" id="cTotal">—</div></div>
    <div class="card"><div class="k">最近运行 · 通过</div><div class="v" style="color:var(--ok)" id="cPassed">—</div></div>
    <div class="card"><div class="k">最近运行 · 失败</div><div class="v" style="color:var(--bad)" id="cFailed">—</div></div>
    <div class="card"><div class="k">通过率</div><div class="v" id="cRate">—</div></div>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>用例清单（按分组）</h2>
      <input type="search" id="q" placeholder="搜索用例名 / 分组…">
      <table>
        <thead><tr><th>用例</th><th>分组</th><th>来源文件</th></tr></thead>
        <tbody id="caseBody"></tbody>
      </table>
    </div>
    <div>
      <div class="panel" style="margin-bottom:16px">
        <h2>运行历史<span style="font-weight:400;color:var(--mut)">（点击展开明细 + 轨迹曲线）</span></h2>
        <div id="runsBox"></div>
      </div>
      <div class="panel">
        <h2>缺陷视图（自动派生 + 人工闭环）</h2>
        <div id="defectsBox"></div>
      </div>
    </div>
  </div>

  <div class="panel" id="livePanel" style="display:none">
    <h2>实时轨迹<span style="font-weight:400;color:var(--mut)">运行中逐用例采样 · SSE 流式 · 边跑边刷新</span></h2>
    <div class="liveSvg"></div>
    <div class="note" id="liveNote">等待运行数据…</div>
  </div>

  <div class="panel">
    <h2>实时性波形（最近会话）<span style="font-weight:400;color:var(--mut)">jitter 周期间隔 vs 名义周期 · latency 超标红线</span></h2>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <img src="/api/waveforms/jitter_1000hz.svg" alt="jitter waveform" style="width:48%;min-width:320px;flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px" onerror="this.parentNode.style.display='none'">
      <img src="/api/waveforms/latency_1000hz.svg" alt="latency waveform" style="width:48%;min-width:320px;flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px" onerror="this.parentNode.style.display='none'">
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var pollTimer = null;
  // ---- 实时轨迹（SSE 流式，运行中边跑边刷新）----
  var liveES = null;
  var liveX = [];           // 累计时间 ms（段间延续）
  var liveQ = [];           // 7 轴关节角（逐段 append）
  var liveSegs = 0;

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  var LIVE_COLORS = ['#38bdf8', '#f472b6', '#a78bfa', '#fbbf24', '#34d399', '#f87171', '#60a5fa'];
  function ensureLive() {
    if (liveES) return;
    $('livePanel').style.display = 'block';
    $('liveNote').textContent = '连接实时流…';
    var es = new EventSource('/api/runs/active/stream');
    es.onopen = function () { $('liveNote').textContent = '实时流已连接 · 已接收 ' + liveSegs + ' 段'; };
    es.onmessage = function (ev) {
      var seg;
      try { seg = JSON.parse(ev.data); } catch (e) { return; }
      if (!seg || !seg.q || !seg.t_ms) return;
      var dof = seg.q.length;
      while (liveQ.length < dof) liveQ.push([]);
      var base = liveX.length ? liveX[liveX.length - 1] : 0;
      for (var i = 0; i < seg.t_ms.length; i++) {
        liveX.push(base + seg.t_ms[i]);
        for (var a = 0; a < dof; a++) liveQ[a].push(seg.q[i][a]);
      }
      liveSegs++;
      $('liveNote').textContent = '运行中 · 已接收 ' + liveSegs + ' 段 · ' + liveX.length + ' 采样点 · 最近: ' + (seg.case || '-');
      try { drawLive(); } catch (e) {
        document.querySelector('.liveSvg').innerHTML = '<div class="empty">曲线渲染失败：' + esc(e.message || e) + '</div>';
      }
    };
    es.onerror = function () {
      if (es.readyState === EventSource.CLOSED) stopLive(true);
    };
    liveES = es;
  }
  function stopLive(final) {
    if (liveES) { liveES.close(); liveES = null; }
    if (final && liveSegs) {
      $('liveNote').textContent = '运行结束 · 本会话共接收 ' + liveSegs + ' 段轨迹（可点开运行历史回看完整曲线）';
    }
  }
  function drawLive() {
    var box = document.querySelector('.liveSvg');
    if (!box || !liveX.length) return;
    var W = 780, H = 200, padL = 46, padR = 10, padT = 14, padB = 22;
    var lo = Infinity, hi = -Infinity;
    liveQ.forEach(function (a) { a.forEach(function (v) { if (v < lo) lo = v; if (v > hi) hi = v; }); });
    if (!isFinite(lo) || !isFinite(hi) || lo === hi) { lo = -1; hi = 1; }
    var n = Math.max(liveX.length - 1, 1);
    var x = function (i) { return padL + (i / n) * (W - padL - padR); };
    var y = function (v) { return padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB); };
    var h = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">';
    for (var g = 0; g <= 4; g++) {
      var vy = lo + (hi - lo) * g / 4;
      h += '<line x1="' + padL + '" y1="' + y(vy) + '" x2="' + (W - padR) + '" y2="' + y(vy) + '" stroke="#26334d" stroke-width="1"/>';
      h += '<text x="' + (padL - 6) + '" y="' + (y(vy) + 4) + '" text-anchor="end" font-size="10" fill="#94a3b8">' + vy.toFixed(Math.abs(vy) < 100 ? 1 : 0) + '</text>';
    }
    h += '<text x="' + (W / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10" fill="#94a3b8">运行累计 t / ms</text>';
    liveQ.forEach(function (a, idx) {
      var pts = [];
      for (var i = 0; i < a.length; i++) pts.push(x(i).toFixed(1) + ',' + y(a[i]).toFixed(1));
      h += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + LIVE_COLORS[idx] + '" stroke-width="1.5"/>';
    });
    for (var j = 0; j < Math.min(liveQ.length, 7); j++) h += '<text x="' + (padL + 6 + j * 24) + '" y="' + (padT - 2) + '" font-size="9" fill="' + LIVE_COLORS[j] + '">J' + (j + 1) + '</text>';
    h += '</svg>';
    box.innerHTML = h;
  }

  function refresh() {
    fetch('/api/summary')
      .then(function (r) { return r.json(); })
      .then(render)
      .catch(function (e) { $('runsBox').innerHTML = '<div class="empty">接口不可用：' + esc(e) + '</div>'; });
  }

  function render(d) {
    var st = d.stats, run = d.latest_run, def = d.defects, prof = d.profile || {};
    $('bProfile').textContent = 'Profile · ' + (prof.name || '—');
    $('bCycle').textContent = 'Cycle · ' + (d.cycle_hz || '—') + ' Hz';
    $('bRun').textContent = '最近运行 · ' + (run ? run.run_id : '—');
    var stBadge = $('bStatus');
    if (!run) { stBadge.textContent = '无运行记录'; stBadge.className = 'badge'; }
    else if (run.status === 'PASS') { stBadge.textContent = 'ALL GREEN'; stBadge.className = 'badge ok'; }
    else { stBadge.textContent = '有失败'; stBadge.className = 'badge bad'; }

    $('cTotal').textContent = st.total_cases;
    $('cPassed').textContent = st.last_passed;
    $('cFailed').textContent = st.last_failed;
    $('cRate').textContent = st.last_total ? (st.last_passed / st.last_total * 100).toFixed(1) + '%' : '—';

    fillGroups(st.by_group || {});
    renderCases(d.cases || []);
    renderRuns(d.runs || []);
    renderDefects(def);
    checkStatus();
  }

  function fillGroups(byGroup) {
    var sel = $('grp');
    var cur = sel.value;
    var names = Object.keys(byGroup).sort();
    if (sel.options.length === names.length + 1 && cur === '') return;
    sel.innerHTML = '<option value="">全量运行</option>' +
      names.map(function (g) { return '<option value="' + esc(g) + '">' + esc(g) + '</option>'; }).join('');
    sel.value = cur;
    $('runBtn').disabled = false;
  }

  function checkStatus() {
    fetch('/api/runs/status')
      .then(function (r) { return r.json(); })
      .then(function (s) {
        var b = $('bStatus');
        if (s.running) {
          $('runBtn').disabled = true;
          b.textContent = '运行中… ' + s.selector;
          b.className = 'badge run';
          ensureLive();
          if (!pollTimer) {
            pollTimer = setInterval(function () {
              fetch('/api/runs/status').then(function (r) { return r.json(); }).then(function (s2) {
                if (!s2.running) {
                  clearInterval(pollTimer); pollTimer = null;
                  stopLive(true);
                  toast('运行完成');
                  refresh();
                }
              }).catch(function () {});
            }, 3000);
          }
        } else {
          $('runBtn').disabled = false;
          if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        }
      }).catch(function () {});
  }

  $('runBtn').addEventListener('click', function () {
    var group = $('grp').value || null;
    fetch('/api/runs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(group ? { group: group } : {})
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (res.started) { toast('已启动运行：' + (res.selector || '全量')); refresh(); }
      else { toast(res.error || '启动失败'); }
    }).catch(function (e) { toast('请求失败：' + e); });
  });

  function renderCases(cases) {
    var body = $('caseBody');
    var q = $('q');
    function draw() {
      var kw = q.value.trim().toLowerCase();
      body.innerHTML = '';
      var hit = 0;
      cases.forEach(function (c) {
        if (kw && c.name.toLowerCase().indexOf(kw) < 0 && c.group.toLowerCase().indexOf(kw) < 0) return;
        hit++;
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>' + esc(c.name) + '</td><td><span class="g">' + esc(c.group) + '</span></td><td style="color:var(--mut)">' + esc(c.file) + '</td>';
        body.appendChild(tr);
      });
      if (!hit) body.innerHTML = '<tr><td colspan="3" class="empty">无匹配用例</td></tr>';
    }
    q.removeEventListener('input', draw);
    q.addEventListener('input', draw);
    draw();
  }

  function renderRuns(runs) {
    var box = $('runsBox');
    if (!runs.length) { box.innerHTML = '<div class="empty">暂无运行记录</div>'; return; }
    box.innerHTML = '';
    runs.forEach(function (r) {
      var d = document.createElement('div');
      d.className = 'run';
      var pct = r.total ? Math.round(r.passed / r.total * 100) : 0;
      d.innerHTML =
        '<div class="top"><span>' + esc(r.run_id) + ' · ' + esc(r.profile) + ' · ' + esc(r.cycle_hz) + 'Hz</span>' +
        '<span>' + r.passed + '/' + r.total + ' · ' + pct + '%</span></div>' +
        '<div class="bar"><i style="width:' + pct + '%;' + (r.status === 'FAIL' ? 'background:var(--bad)' : '') + '"></i></div>' +
        '<div class="detail" data-rid="' + esc(r.run_id) + '"><div class="empty">加载中…</div></div>';
      d.addEventListener('click', function () { toggleDetail(r.run_id, d); });
      box.appendChild(d);
    });
  }

  var detailCache = {};
  var hasTraj = {};
  function toggleDetail(runId, rowEl) {
    var dd = rowEl.querySelector('.detail');
    if (dd.classList.contains('open')) { dd.classList.remove('open'); return; }
    dd.classList.add('open');
    if (detailCache[runId]) {
      dd.innerHTML = detailCache[runId];
      if (hasTraj[runId]) loadTrajectory(runId, dd);   // 缓存命中也要重画曲线
      return;
    }
    Promise.all([
      fetch('/api/runs/' + encodeURIComponent(runId)).then(function (r) { return r.json(); }),
      fetch('/api/runs/' + encodeURIComponent(runId) + '/waveform').then(function (r) { return r.json(); })
    ]).then(function (res) {
      var d = res[0], w = res[1];
      if (d.error) { dd.innerHTML = '<div class="empty">' + esc(d.error) + '</div>'; return; }
      var rows = (d.cases || []).map(function (c) {
        var st = c.status === 'PASS' ? 'pass' : 'fail';
        var dur = (typeof c.duration_s === 'number') ? c.duration_s.toFixed(2) + 's' : '';
        return '<tr><td>' + esc(c.name) + '</td><td><span class="st ' + st + '">' + esc(c.status) + '</span></td>' +
               '<td style="color:var(--mut)">' + esc(c.detail || '') + '</td><td>' + dur + '</td></tr>';
      }).join('');
      var html = '<table><thead><tr><th>用例</th><th>状态</th><th>说明</th><th>耗时</th></tr></thead><tbody>' + rows + '</tbody></table>' +
      '<div class="trajBox" style="margin-top:10px;display:none">' +
      '<div style="display:flex;gap:6px;margin-bottom:6px">' +
      '<button type="button" class="mbtn" data-m="q">位置</button>' +
      '<button type="button" class="mbtn" data-m="dq">速度</button>' +
      '<button type="button" class="mbtn" data-m="ddq">加速度</button>' +
      '<span style="color:var(--mut);align-self:center;margin-left:6px">7 轴运动轨迹（抽稀采样）</span></div>' +
      '<div class="trajSvg"></div></div>';

      // 数据曲线（逐周期 jitter / latency 可视化）
      var curves = (w && w.curves) || [];
      if (curves.length) {
        html += '<div style="margin-top:12px"><div style="font-size:13px;color:var(--txt);margin-bottom:8px">数据曲线（逐周期 jitter / latency）</div>';
        curves.forEach(function (cv) {
          var hz = cv.cycle_hz || d.cycle_hz || 0;
          var nominal = hz ? 1000000 / hz : 0;
          html += '<div style="margin-bottom:14px">' +
            '<div style="color:var(--mut);font-size:12px;margin-bottom:4px">' + esc(cv.name) +
            ' · ' + hz + 'Hz · slaves=' + esc(cv.slaves || '-') + ' · overrun=' + (cv.overrun_cycles || 0) + '</div>';
          html += waveSVG(cv.interval_us.map(function (v) { return v - nominal; }),
                          {title: 'Cycle Jitter (vs nominal ' + nominal.toFixed(0) + 'us)', yLabel: 'jitter(us)', baseline: 0});
          html += waveSVG(cv.processing_us,
                          {title: 'Per-Cycle Processing Latency', yLabel: 'latency(us)', limit: nominal, highlightAbove: nominal});
          html += '<div style="color:var(--mut);font-size:11px">jitter: ' + esc(cv.jitter_stats || '') +
                  ' ｜ latency: ' + esc(cv.latency_stats || '') + '</div></div>';
        });
        html += '</div>';
      } else {
        html += '<div class="note">本 run 无波形数据（仅全量/波形报告分组运行时产生）</div>';
      }
      detailCache[runId] = html;
      dd.innerHTML = html;
      hasTraj[runId] = !!(d && d.has_trajectory);
      if (hasTraj[runId]) loadTrajectory(runId, dd);
    }).catch(function (e) { dd.innerHTML = '<div class="empty">加载失败：' + esc(e) + '</div>'; });
  }

  var TRAJ_COLORS = ['#38bdf8', '#f472b6', '#a78bfa', '#fbbf24', '#34d399', '#f87171', '#60a5fa'];
  function drawTraj(svgEl, data, metric) {
    var series = data[metric];
    var t = data.time_ms;
    var W = 780, H = 200, padL = 46, padR = 10, padT = 14, padB = 22;
    var lo = Infinity, hi = -Infinity;
    series.forEach(function (a) { a.forEach(function (v) { if (v < lo) lo = v; if (v > hi) hi = v; }); });
    if (!isFinite(lo) || !isFinite(hi) || lo === hi) { lo = -1; hi = 1; }
    var n = Math.max(t.length - 1, 1);
    var x = function (i) { return padL + (i / n) * (W - padL - padR); };
    var y = function (v) { return padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB); };
    var h = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">';
    for (var g = 0; g <= 4; g++) {
      var vy = lo + (hi - lo) * g / 4;
      h += '<line x1="' + padL + '" y1="' + y(vy) + '" x2="' + (W - padR) + '" y2="' + y(vy) + '" stroke="#26334d" stroke-width="1"/>';
      h += '<text x="' + (padL - 6) + '" y="' + (y(vy) + 4) + '" text-anchor="end" font-size="10" fill="#94a3b8">' + vy.toFixed(Math.abs(vy) < 100 ? 1 : 0) + '</text>';
    }
    h += '<text x="' + (W / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10" fill="#94a3b8">t / ms</text>';
    series.forEach(function (a, idx) {
      var pts = [];
      for (var i = 0; i < a.length; i++) pts.push(x(i).toFixed(1) + ',' + y(a[i]).toFixed(1));
      h += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + TRAJ_COLORS[idx] + '" stroke-width="1.5"/>';
    });
    for (var j = 0; j < 7; j++) h += '<text x="' + (padL + 6 + j * 24) + '" y="' + (padT - 2) + '" font-size="9" fill="' + TRAJ_COLORS[j] + '">J' + (j + 1) + '</text>';
    h += '</svg>';
    svgEl.innerHTML = h;
  }
  function loadTrajectory(runId, dd) {
    var box = dd.querySelector('.trajBox');
    if (!box) return;
    box.style.display = 'block';
    fetch('/api/runs/' + encodeURIComponent(runId) + '/trajectory?max_points=400').then(function (r) { return r.json(); }).then(function (d) {
      if (d.error || !d.q) { box.style.display = 'none'; return; }
      try { drawTraj(box.querySelector('.trajSvg'), d, 'q'); } catch (e) {
        box.querySelector('.trajSvg').innerHTML = '<div class=empty>曲线渲染失败：' + esc(e.message || e) + '</div>';
      }
      var btns = box.querySelectorAll('.mbtn');
      btns.forEach(function (b) { b.addEventListener('click', function () { drawTraj(box.querySelector('.trajSvg'), d, b.getAttribute('data-m')); }); });
    }).catch(function () { box.style.display = 'none'; });
  }

  function renderDefects(def) {
    var box = $('defectsBox');
    if (!def || !def.latest_run) { box.innerHTML = '<div class="empty">尚无运行记录</div>'; return; }
    var html = '';
    if (def.open.length) {
      def.open.forEach(function (x) {
        var manual = x.manual ? '<span class="manual">· MANUAL</span>' : '';
        html += '<div class="def"><span class="dot' + (x.manual ? ' m' : '') + '"></span><div style="flex:1">' +
          '<b>' + esc(x.id) + '</b> · ' + esc(x.case) + manual + '<br>' +
          '<span style="color:var(--mut)">' + esc(x.detail) + (x.reason ? '（' + esc(x.reason) + '）' : '') + '</span></div>' +
          '<button class="mini close" data-bug="' + esc(x.id) + '" data-act="close">关闭</button></div>';
      });
    } else {
      html = '<div class="empty">' + esc(def.note) + '</div>';
    }
    if (def.closed.length) {
      html += '<div class="def"><span class="dot c"></span><div style="color:var(--mut)">已闭环 ' + def.closed.length + ' 项</div></div>';
      def.closed.forEach(function (x) {
        var manual = x.manual ? '<span class="manual">· MANUAL</span>' : '';
        html += '<div class="def"><span class="dot c"></span><div style="flex:1;color:var(--mut)">' +
          esc(x.id) + ' · ' + esc(x.case) + manual + '<br>' + esc(x.detail) + '</div>' +
          '<button class="mini reopen" data-bug="' + esc(x.id) + '" data-act="reopen">重开</button></div>';
      });
    }
    html += '<div class="note">闭环链路：失败用例 → BUG → 修复 → 回归 PASS → CLOSED；可人工关闭/重开（MANUAL 覆盖自动状态）</div>';
    box.innerHTML = html;
  }

  $('defectsBox').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-bug]');
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    var bug = btn.getAttribute('data-bug');
    var verb = act === 'close' ? '关闭' : '重开';
    if (!window.confirm('确认' + verb + ' ' + bug + ' ？')) return;
    fetch('/api/defects/' + encodeURIComponent(bug) + '/' + act, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reason: '控制台人工操作' })
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (res.ok) { toast(bug + ' 已' + verb); refresh(); }
      else { toast(res.error || '操作失败'); }
    }).catch(function (err) { toast('请求失败：' + err); });
  });

  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

  // 零依赖折线图（暗色主题，复用 waveform.py 语义）：baseline 参考线 / limit 阈值线 / overrun 标红
  function waveSVG(data, o) {
    o = o || {};
    var width = 860, height = 190, padL = 56, padR = 16, padT = 26, padB = 30;
    var plotW = width - padL - padR, plotH = height - padT - padB;
    var n = data ? data.length : 0;
    if (!n) return '<div class="empty">' + esc(o.title || '曲线') + '：无数据</div>';
    var vals = data.slice();
    if (o.baseline != null) vals.push(o.baseline);
    if (o.limit != null) vals.push(o.limit);
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if (hi - lo < 1e-9) hi = lo + 1;
    var span = hi - lo; lo -= span * 0.08; hi += span * 0.08;
    function X(i) { return padL + (n > 1 ? i / (n - 1) : 0.5) * plotW; }
    function Y(v) { return padT + (1 - (v - lo) / (hi - lo)) * plotH; }
    var s = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 " + width + " " + height +
            "' style='width:100%;height:auto;display:block' font-family='Segoe UI, Microsoft YaHei, sans-serif'>";
    s += "<text x='" + padL + "' y='15' font-size='13' fill='#e2e8f0'>" + esc(o.title || '') + "</text>";
    for (var k = 0; k <= 5; k++) {
      var v = lo + (hi - lo) * k / 5, yy = Y(v);
      s += "<line x1='" + padL + "' y1='" + yy.toFixed(1) + "' x2='" + (width - padR) +
           "' y2='" + yy.toFixed(1) + "' stroke='#334155' stroke-width='1'/>";
      s += "<text x='" + (padL - 6) + "' y='" + (yy + 4).toFixed(1) +
           "' font-size='10' fill='#94a3b8' text-anchor='end'>" + v.toFixed(0) + "</text>";
    }
    if (o.baseline != null) {
      var by = Y(o.baseline);
      s += "<line x1='" + padL + "' y1='" + by.toFixed(1) + "' x2='" + (width - padR) +
           "' y2='" + by.toFixed(1) + "' stroke='#22d3ee' stroke-width='1.3' stroke-dasharray='5,4'/>";
    }
    if (o.limit != null) {
      var ly = Y(o.limit);
      s += "<line x1='" + padL + "' y1='" + ly.toFixed(1) + "' x2='" + (width - padR) +
           "' y2='" + ly.toFixed(1) + "' stroke='#ef4444' stroke-width='1.3'/>";
    }
    var pts = [];
    for (var i = 0; i < n; i++) pts.push(X(i).toFixed(1) + "," + Y(data[i]).toFixed(2));
    s += "<polyline points='" + pts.join(' ') + "' fill='none' stroke='#38bdf8' stroke-width='1.5' stroke-linejoin='round'/>";
    if (o.highlightAbove != null) {
      var seg = [];
      for (var j = 0; j < n; j++) {
        if (data[j] > o.highlightAbove) seg.push(X(j).toFixed(1) + "," + Y(data[j]).toFixed(2));
        else if (seg.length >= 2) { s += redSeg(seg); seg = []; }
      }
      if (seg.length >= 2) s += redSeg(seg);
    }
    var idxs = [0, Math.floor(n / 2), n - 1];
    for (var m = 0; m < idxs.length; m++) {
      s += "<text x='" + X(idxs[m]).toFixed(1) + "' y='" + (height - 9) +
           "' font-size='10' fill='#64748b' text-anchor='middle'>#" + idxs[m] + "</text>";
    }
    s += "</svg>";
    return s;
  }
  function redSeg(seg) {
    return "<polyline points='" + seg.join(' ') + "' fill='none' stroke='#ef4444' stroke-width='2.2'/>";
  }

  refresh();
  setInterval(function () {
    var b = $('bStatus');
    if (b.textContent.indexOf('运行中') < 0) refresh();
  }, 15000);
})();
</script>
